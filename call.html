<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Call</title>

<style>

body{
margin:0;
background:#111;
color:white;
font-family:Arial,sans-serif;
text-align:center;
overflow:hidden;
}

h2{
margin-top:20px;
}

#callTime{
font-size:18px;
color:#00ff99;
margin-bottom:10px;
}

#remoteVideo{
width:100%;
height:70vh;
background:black;
object-fit:cover;
}

#myVideo{
position:fixed;
right:15px;
bottom:100px;
width:140px;
height:190px;
background:black;
border:2px solid white;
border-radius:10px;
object-fit:cover;
}

.controls{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:15px;
}

.controls button{
width:60px;
height:60px;
border:none;
border-radius:50%;
font-size:24px;
cursor:pointer;
}

#muteBtn{
background:#444;
color:white;
}

#cameraBtn{
background:#2196F3;
color:white;
}

#endBtn{
background:red;
color:white;
}

</style>

</head>

<body>

<h2 id="callTitle">Connecting...</h2>

<p id="callTime">00:00</p>

<video
id="remoteVideo"
autoplay
playsinline>
</video>

<video
id="myVideo"
autoplay
muted
playsinline>
</video>

<div class="controls">

<button id="muteBtn">
🎤
</button>

<button id="cameraBtn">
📷
</button>

<button id="endBtn">
📞
</button>

</div>

<script type="module" src="call.js"></script>

</body>
</html>
